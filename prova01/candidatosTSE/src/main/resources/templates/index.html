<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candidatos - Eleições 2026 - MG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap">
  <link rel="stylesheet" th:href="@{/css/index.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<header class="main-header">
  <div class="header-container">
    <h1><i class="fa-solid fa-check-to-slot"></i> Candidatos - Eleições 2026 - MG</h1>
    <span class="header-fonte">Dados do TSE</span>
  </div>
</header>

<main class="container">

  <form method="get" th:action="@{/}" class="filtros">

    <div class="campo campo-busca">
      <label for="texto">Buscar</label>
      <input type="text" id="texto" name="texto" th:value="${texto}"
             placeholder="Nome, nome de urna ou número">
    </div>

    <div class="campo">
      <label for="cargo">Cargo</label>
      <select id="cargo" name="cargo">
        <option value="">Todos</option>
        <option th:each="c : ${cargos}" th:value="${c}" th:text="${c}"
                th:selected="${c == cargo}"></option>
      </select>
    </div>

    <div class="campo">
      <label for="partido">Partido</label>
      <select id="partido" name="partido">
        <option value="">Todos</option>
        <option th:each="p : ${partidos}" th:value="${p}" th:text="${p}"
                th:selected="${p == partido}"></option>
      </select>
    </div>

    <div class="acoes">
      <button type="submit" class="button"><i class="fa-solid fa-magnifying-glass"></i> Filtrar</button>
      <a th:href="@{/}" class="button2">Limpar</a>
    </div>

  </form>

  <p class="resultado-total">
    <strong th:text="${total}">0</strong>
    <span th:text="${total == 1} ? 'candidato encontrado' : 'candidatos encontrados'">candidatos encontrados</span>
  </p>

  <p class="vazio" th:if="${total == 0}">
    Nenhum candidato encontrado para esse filtro.
  </p>

  <section class="grade">

    <article class="card" th:each="c : ${candidatos}">

      <div class="card-foto">
        <img th:if="${c.temFoto}" th:src="@{'/images/' + ${c.nomeArquivoFoto}}"
             th:alt="${c.nomeUrna}" loading="lazy">
        <div th:unless="${c.temFoto}" class="sem-foto">
          <i class="fa-regular fa-user"></i>
          <span>Sem foto</span>
        </div>
      </div>

      <div class="card-info">
        <h2 th:text="${c.nomeUrna}">Nome de urna</h2>
        <p class="nome-civil" th:text="${c.nomeCandidato}">Nome completo</p>

        <div class="tags">
          <span class="tag tag-numero" th:text="${c.nrCandidato}">00</span>
          <span class="tag tag-partido" th:text="${c.siglaPartido}">PARTIDO</span>
          <span class="tag" th:text="${c.cargo}">CARGO</span>
        </div>

        <ul class="dados">
          <li><span>Partido</span><strong th:text="${c.nomePartido}">-</strong></li>
          <li th:if="${c.idade > 0}"><span>Idade</span><strong th:text="${c.idade} + ' anos'">-</strong></li>
          <li th:if="${!#strings.isEmpty(c.ocupacao)}"><span>Ocupação</span><strong th:text="${c.ocupacao}">-</strong></li>
          <li th:if="${!#strings.isEmpty(c.grauInstrucao)}"><span>Instrução</span><strong th:text="${c.grauInstrucao}">-</strong></li>
          <li th:if="${!#strings.isEmpty(c.genero)}"><span>Gênero</span><strong th:text="${c.genero}">-</strong></li>
          <li><span>Local</span><strong th:text="${c.municipio} + ' / ' + ${c.uf}">-</strong></li>
        </ul>
      </div>

    </article>

  </section>

</main>

</body>
</html>
