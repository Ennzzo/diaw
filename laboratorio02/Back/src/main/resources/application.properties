spring.application.name=aluguel

# ==========================================================================
# SERVIDOR
# Localmente a API roda em http://localhost:8080
# No Render a porta vem da variavel PORT
# ==========================================================================
server.port=${PORT:8080}

# ==========================================================================
# SUPABASE (PostgreSQL)
# Localmente os valores vem do arquivo .env (copie o .env.example)
# No Render, cadastre DB_URL, DB_USER e DB_PASSWORD em Environment
# Supabase > Connect > JDBC > Session pooler (porta 5432)
# ==========================================================================
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/aluguel}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ==========================================================================
# JWT (login)
# Em producao defina JWT_SECRET com pelo menos 32 caracteres
# ==========================================================================
jwt.secret=${JWT_SECRET:chave-secreta-do-lab02-de-diaw-aluguel-de-carros-2026}
jwt.expiracao-horas=8

# ==========================================================================
# CORS (quem pode chamar a API pelo navegador)
# - http://localhost:5173 -> front rodando no computador
# - https://*.vercel.app  -> front publicado na Vercel
# Separe por virgula e sem barra no final
# ==========================================================================
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,https://*.vercel.app}
