spring.application.name=aluguel

# as credenciais do Supabase ficam no .env (ver .env.example)
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/aluguel}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:chave-secreta-do-lab02-de-diaw-aluguel-de-carros-2026}
jwt.expiracao-horas=8
