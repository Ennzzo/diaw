# Roda os testes do laboratorio02 a cada push/pull request (aba "Actions" do GitHub)
name: CI laboratorio02

on:
  push:
    paths:
      - "laboratorio02/**"
      - ".github/workflows/laboratorio02.yml"
  pull_request:
    paths:
      - "laboratorio02/**"

jobs:
  back:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laboratorio02/Back
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B test

  front:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laboratorio02/Front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: laboratorio02/Front/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
