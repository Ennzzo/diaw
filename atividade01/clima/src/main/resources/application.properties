# ==========================================
# Configuracoes gerais da aplicacao
# ==========================================
spring.application.name=clima-api
server.port=8080

# ==========================================
# Configuracoes da API externa (Open-Meteo)
# Open-Meteo NAO exige API Key para uso nao comercial,
# por isso apenas as URLs base sao configuradas aqui.
# Caso troque para uma API que exija chave (ex: OpenWeather,
# WeatherAPI), adicione a propriedade abaixo e leia-a via
# @Value("${clima.api.key}") no service, por exemplo:
#
# clima.api.key=SUA_CHAVE_AQUI
# ==========================================
clima.api.forecast-url=https://api.open-meteo.com/v1/forecast
clima.api.geocoding-url=https://geocoding-api.open-meteo.com/v1/search

# Coordenadas padrao: Belo Horizonte - MG
clima.default.cidade=Belo Horizonte
clima.default.estado=MG
clima.default.latitude=-19.9167
clima.default.longitude=-43.9345

# ==========================================
# Logging
# ==========================================
logging.level.com.example.clima=INFO

