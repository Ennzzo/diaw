spring.application.name=clima
server.port=8080

# Mostra a mensagem de erro no JSON de resposta
spring.web.error.include-message=always

# API externa: Open-Meteo (nao exige API Key).
# Se o projeto usasse uma API com chave, ela seria lida de uma variavel
# de ambiente para nao ficar exposta no codigo:
# clima.api.key=${CLIMA_API_KEY}
clima.api.forecast-url=https://api.open-meteo.com/v1/forecast
clima.api.geocoding-url=https://geocoding-api.open-meteo.com/v1/search

# Belo Horizonte - MG
clima.bh.cidade=Belo Horizonte
clima.bh.estado=MG
clima.bh.latitude=-19.9167
clima.bh.longitude=-43.9345
